<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<link rel="manifest" href="manifest.json">
<title>筋トレ記録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>筋トレ記録</h1>

  <section class="field">
    <label for="recordDate">日付</label>
    <input type="date" id="recordDate">
  </section>

  <section class="field">
    <label for="exerciseName">種目</label>
    <div class="exercise-input-wrap">
      <input id="exerciseName" placeholder="例: ベンチプレス" autocomplete="off">
      <ul id="exerciseSuggestions" class="suggestions" hidden></ul>
    </div>
  </section>

  <section id="lastRecord" class="last-record">種目を入力してください</section>

  <section class="field-row">
    <div class="field">
      <label for="weight">重量 (kg)</label>
      <input type="number" id="weight" inputmode="decimal" step="0.5" min="0">
    </div>
    <div class="field">
      <label for="reps">回数</label>
      <input type="number" id="reps" inputmode="numeric" min="0">
    </div>
    <div class="field">
      <label for="sets">セット数</label>
      <input type="number" id="sets" inputmode="numeric" min="0" value="3">
    </div>
  </section>

  <section class="field rir-field">
    <div class="label-row">
      <label>RIR(余力・任意)</label>
      <button type="button" id="rirTipBtn" class="tip-btn" aria-expanded="false" aria-controls="rirTip">?</button>
    </div>
    <p id="rirTip" class="tip" hidden>RIR = あと何回できたか。そのセットが終わった時点の余力です。0 = 限界まで、1 = あと1回、2 = あと2回…。目標の回数でRIRが3以上の日が続いたら、重量を少し上げどきです。</p>
    <div id="rirButtons" class="rir-buttons">
      <button type="button" data-rir="0">0</button>
      <button type="button" data-rir="1">1</button>
      <button type="button" data-rir="2">2</button>
      <button type="button" data-rir="3">3</button>
      <button type="button" data-rir="4">4</button>
      <button type="button" data-rir="5">5</button>
    </div>
  </section>

  <label class="assist-field">
    <input type="checkbox" id="assistToggle">
    アシスト(補助ありでマイナス換算)
  </label>

  <button id="saveBtn">保存</button>

  <p id="message" class="message"></p>

  <section class="history">
    <h2>履歴</h2>
    <div id="historyList"></div>
  </section>

  <button id="refreshBtn" class="secondary-btn">最新版に更新(キャッシュクリア)</button>
  <p id="version" class="version"></p>
</main>
<script src="app.js"></script>
</body>
</html>
